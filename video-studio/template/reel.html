<!doctype html>
<!--
  HyperFrames template for vertical 9:16 reels (YouTube Shorts / WhatsApp / Instagram).
  `npm run reel:build` fills the double-brace tokens from reels/<name>/reel.json and writes
  reel-edit/index.html. Change the look here — never edit reel-edit/index.html directly.
  Each scene is one photo with a slow camera move; captions sit in the Shorts-safe middle band.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: {{ACCENT}};
        --ink: #fff8ee;
        --serif: Georgia, "Times New Roman", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--serif);
      }
      .layer {
        position: absolute;
        inset: 0;
      }

      /* Scenes: one full-frame photo each, moved by the timeline (scale / x) */
      .shot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        will-change: transform, opacity;
      }

      /* Film look: vignette, a darker band behind the captions, fixed grain */
      #grade {
        z-index: 20;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.5) 62%, rgba(0, 0, 0, 0.62) 78%, rgba(0, 0, 0, 0.35) 100%),
          radial-gradient(130% 90% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
      }
      #grain {
        z-index: 21;
        pointer-events: none;
        opacity: 0.07;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }

      #watermark {
        z-index: 30;
        position: absolute;
        top: 150px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 30px;
        font-style: italic;
        letter-spacing: 0.06em;
        opacity: 0.6;
      }

      /* Captions: kept between the top UI and the Shorts title/buttons at the bottom */
      .caption {
        z-index: 40;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 1160px 110px 0;
      }
      .caption span {
        display: block;
        font-size: 68px;
        line-height: 1.22;
        text-align: center;
        text-shadow:
          0 2px 4px rgba(0, 0, 0, 0.6),
          0 4px 28px rgba(0, 0, 0, 0.75);
      }

      /* End card */
      #endcard {
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 90px;
        background: rgba(8, 6, 4, 0.66);
      }
      #endcard .brand {
        display: block;
        font-size: 118px;
        font-style: italic;
        letter-spacing: -0.01em;
      }
      #endcard .rule {
        display: block;
        width: 140px;
        height: 4px;
        margin: 40px 0;
        border-radius: 2px;
        background: var(--accent);
      }
      #endcard .tagline {
        display: block;
        max-width: 820px;
        font-size: 46px;
        line-height: 1.3;
        opacity: 0.88;
      }
      #endcard .follow {
        display: block;
        margin-top: 70px;
        padding: 20px 46px;
        border: 3px solid var(--accent);
        border-radius: 999px;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 38px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--accent);
      }
      #endcard .handle {
        display: block;
        margin-top: 26px;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 32px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{TOTAL}}"
      data-width="1080"
      data-height="1920"
    >
{{SCENES}}

      <div id="grade" class="layer"></div>
      <div id="grain" class="layer"></div>
      <div id="watermark" data-layout-allow-occlusion>{{CHANNEL}}</div>

      <!-- if:voice -->
      <audio
        id="voice"
        class="clip"
        data-start="0"
        data-duration="{{VOICE_DURATION}}"
        data-track-index="2"
        src="{{VOICE_SRC}}"
        data-has-audio="true"
      ></audio>
      <!-- /if:voice -->

{{CAPTIONS}}

      <div id="endcard" class="clip layer" data-start="{{END_START}}" data-duration="{{END_DURATION}}" data-track-index="4">
        <span class="brand">{{CHANNEL}}</span>
        <span class="rule"></span>
        <span class="tagline">{{TAGLINE}}</span>
        <span class="follow">Follow for more</span>
        <span class="handle">{{HANDLE}}</span>
      </div>
    </div>

    <script>
      const T = {{TIMING_JSON}};
      const tl = gsap.timeline({ paused: true });

      // Slow camera move on every photo (ease "none" keeps the drift constant), cross-fading in.
      T.scenes.forEach((s, i) => {
        const el = document.getElementById(s.id);
        tl.fromTo(el, { scale: s.from.scale, x: s.from.x }, { scale: s.to.scale, x: s.to.x, duration: s.duration, ease: "none" }, s.start);
        if (i > 0) tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: T.crossfade, ease: "power1.inOut" }, s.start);
      });

      // Captions rise in softly and fade just before the next line.
      T.captions.forEach((c) => {
        const span = document.getElementById(c.id).querySelector("span");
        tl.fromTo(span, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, c.start);
        tl.to(span, { opacity: 0, duration: 0.18, ease: "power1.in" }, c.end - 0.18);
      });

      const E = T.endcard;
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, E.start)
        .from("#endcard .brand", { y: 40, opacity: 0, duration: 0.8, ease: "power3.out" }, E.start + 0.1)
        .from("#endcard .rule", { scaleX: 0, duration: 0.6, ease: "power3.out" }, E.start + 0.35)
        .from("#endcard .tagline", { y: 24, opacity: 0, duration: 0.7, ease: "power3.out" }, E.start + 0.45)
        .from("#endcard .follow", { y: 20, opacity: 0, duration: 0.6, ease: "back.out(1.6)" }, E.start + 0.75)
        .from("#endcard .handle", { opacity: 0, duration: 0.6 }, E.start + 0.95);

      tl.set({}, {}, T.total);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
